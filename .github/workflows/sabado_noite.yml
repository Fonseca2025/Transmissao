name: Notificação de Sábado (Véspera de Domingo)

on:
  schedule:
    # 00:00 UTC de Domingo = 21:00 Horário de Brasília no Sábado
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permite você rodar manualmente para testar

jobs:
  enviar_vespera:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: pip install requests pytz

      - name: Rodar Script em Modo Véspera
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO_VESPERA: 'true'
        run: python main.py
